<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Toyota Vehicle Maintenance Management</title>
  <style>
    /* Simple modern styling */
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --accent:#2b6cb0;
      --muted:#6b7280;
      --success:#16a34a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:var(--bg);
      color:#111827;
    }
    header{
      background:linear-gradient(90deg,#ffffffcc, #f0f5ff);
      border-bottom:1px solid #e6eefc;
      padding:1rem;
      display:flex;
      gap:1rem;
      align-items:center;
      justify-content:space-between;
      position:sticky;
      top:0;
      z-index:10;
    }
    .brand{
      display:flex; gap:.75rem; align-items:center;
    }
    .logo{
      width:44px;height:44px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;
      color:white;font-weight:700;font-size:18px;box-shadow:0 2px 6px rgba(43,108,176,.12)
    }
    nav a{
      margin-right:.6rem;
      color:var(--accent); text-decoration:none; padding:.35rem .6rem; border-radius:6px;
    }
    nav a.active{ background:rgba(43,108,176,.08); font-weight:600;}
    main{display:grid;grid-template-columns:260px 1fr; gap:1rem; padding:1rem; max-width:1200px;margin:0 auto;}
    aside{
      background:var(--card); padding:1rem; border-radius:12px; box-shadow:0 6px 18px rgba(16,24,40,.04);
      height:fit-content;
    }
    .card{ background:var(--card); padding:1rem; border-radius:12px; box-shadow:0 6px 18px rgba(16,24,40,.04); margin-bottom:1rem;}
    .small{ color:var(--muted); font-size:.95rem;}
    ul.menu{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:.4rem;}
    ul.menu li a{ display:block; padding:.6rem; text-decoration:none; color:#0f172a; border-radius:8px;}
    ul.menu li a:hover{ background:#f1f5f9; }
    section.content{ padding:1rem; }
    h2{ margin:.2rem 0 0.6rem 0; }
    table{ width:100%; border-collapse:collapse; font-size:.95rem;}
    th,td{ text-align:left; padding:.6rem .5rem; border-bottom:1px solid #eef2f7; }
    th{ background:#fbfdff; color:#334155; font-weight:600; }
    .btn{ display:inline-block; padding:.45rem .7rem; border-radius:8px; text-decoration:none; cursor:pointer; }
    .btn.primary{ background:var(--accent); color:white;}
    .btn.ghost{ border:1px solid #e6eefc; background:transparent; color:var(--accent); }
    .badge{ padding:.2rem .45rem; border-radius:999px; background:#eff6ff; color:var(--accent); font-weight:600; font-size:.85rem }
    .search{ width:100%; padding:.5rem .6rem; border-radius:8px; border:1px solid #e6eefc; }
    footer{ text-align:center; padding:1rem; color:var(--muted); font-size:.9rem; }
    /* responsive */
    @media (max-width:900px){
      main{ grid-template-columns:1fr; padding: .75rem; }
      aside{ order:2;}
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">☮</div>
    <div>
      <div style="font-weight:700">Toyota Vehicle Maintenance</div>
    </div>
  </div>

  <nav aria-label="Main navigation">
    <!-- internal hyperlinks (anchors) -->
    <a href="#home">Home</a>
    <a href="#clients">Clients</a>
    <a href="#customers">Customers</a>
    <!-- example external hyperlink -->
    <a href="https://example.com" target="_blank" rel="noopener noreferrer" title="External example link">Help</a>
     <a class="link" href="index.html">Logout</a>
  </nav>
</header>

<main>
      <div style="margin-top:1rem">
        <h3 style="margin:.4rem 0">Recent Clients</h3>
        <table aria-label="Recent sales">
          <thead>
            <tr><th>Full Name</th><th>Time</th><th>Total</th><th>Date</th></tr>
          </thead>
          <tbody id="recentSales">
            <tr><td>Drake Shante N. Chanco</td><td>3:25pm</td><td>₱1520.00</td><td>June 13, 2025</td></tr>
            <tr><td>Ej N. Chanco</td><td>1:00pm</td><td>₱1225.00</td><td>May 13, 2025</td></tr>
          </tbody>
        </table>
      </div>
    </section>
</script>
</body>
</html>
